name: Deploy to GitHub Pages

# main に push されるたびに、図鑑をビルドして GitHub Pages に公開します。
# TypeScript(.ts / .tsx)はブラウザがそのままでは読めないため、
# ここでビルドして出来上がる dist/ の中身(HTML / CSS / JS)を公開します。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 続けて push したときは、古いほうの公開を取りやめて最新だけを公開する
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # データやコードに問題があるときは、公開せずにここで止める
      - run: npm run validate
      - run: npm test
      - run: npm run build
        env:
          # 図鑑の「情報を直す・追加する」リンクの行き先。リポジトリの URL が自動で入る
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
