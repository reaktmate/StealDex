name: Validate data

on:
  pull_request:
    paths:
      - "data/**"
      - "public/items/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "public/items/**"
      - "scripts/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate item data
        run: npm run validate
